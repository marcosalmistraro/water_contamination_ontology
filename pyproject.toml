[build-system]
requires = ["setuptools>=68", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-ontology"
version = "0.1.0"
description = "Ontology-driven pipeline for water contamination intelligence"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "owlready2>=0.46",
    "pyshacl>=0.25",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "geopandas>=0.14",
    "pdfplumber>=0.10",
    "typer>=0.12",
    "rich>=13.7",
    "mlflow>=2.12",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    "folium>=0.17",
    "langchain>=0.2",
    "langchain-groq>=0.1",
    "langchain-core>=0.2",
    "pyoxigraph>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
    "types-PyYAML",
    "httpx2",
]

[project.scripts]
water-ontology = "water_ontology.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = [
    "ANN401",  # Any is required for pyoxigraph adapter and other untyped boundaries
    "UP042",   # str+Enum pattern used in CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # test files don't need type annotations

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "numpy.*", "pandas.*", "geopandas.*", "shapely.*", "pdfplumber.*",
    "pyoxigraph.*", "folium.*", "mlflow.*", "langchain.*", "langchain_groq.*",
    "langchain_core.*", "streamlit.*", "streamlit_folium.*", "huggingface_hub.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# These modules interact directly with rdflib/pyoxigraph internals whose
# type stubs are incomplete or incorrect — suppress errors rather than
# scatter dozens of type: ignore comments.
module = [
    "water_ontology.graph",
    "water_ontology.oxigraph_adapter",
    "water_ontology.query.engine",
    "water_ontology.linkers.spatial_joiner",
    "water_ontology.ingesters.eprtr",
    "water_ontology.ingesters.waterbase",
    "water_ontology.ingesters.geojson_ingester",
    "water_ontology.ingesters.monitoring_sites_ingester",
    "water_ontology.ingesters.pdf_ingester",
    "water_ontology.ingesters.rdf_ingester",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=water_ontology --cov-report=term-missing"

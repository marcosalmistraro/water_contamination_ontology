[build-system]
requires = ["setuptools>=68", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-ontology"
version = "0.1.0"
description = "Ontology-driven pipeline for water contamination intelligence"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "owlready2>=0.46",
    "pyshacl>=0.25",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "geopandas>=0.14",
    "pdfplumber>=0.10",
    "typer>=0.12",
    "rich>=13.7",
    "mlflow>=2.12",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    "folium>=0.17",
    "langchain>=0.2",
    "langchain-groq>=0.1",
    "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
    "types-PyYAML",
    "httpx2",
]

[project.scripts]
water-ontology = "water_ontology.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=water_ontology --cov-report=term-missing"
